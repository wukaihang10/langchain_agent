[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-agent"
version = "0.1.0"
description = "A learning project for modern LangChain and LangGraph agent engineering."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anyio>=4.0,<5",
    "deepagents>=0.7,<0.8",
    "httpx>=0.27,<1",
    "langchain>=1.3,<2",
    "langchain-core>=1.6,<2",
    "langchain-deepseek>=1.1,<2",
    "langchain-mcp-adapters>=0.3,<0.4",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint>=4.1,<5",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "numpy>=2.0,<3",
    "prompt-toolkit>=3.0,<4",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "sentence-transformers>=5.0,<6",
]

[project.scripts]
langchain-agent = "langchain_agent.cli.app:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["langchain_agent*"]
namespaces = false
